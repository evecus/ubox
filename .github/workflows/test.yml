name: test

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew


      # 正式签名 keystore (可选 secret). 未配置时跳过,
      # build.gradle 自动回退 runner 预置的 debug keystore, release 仍可安装.
      - name: Decode keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      # 单个 APK 同时包含 arm64-v8a 与 armeabi-v7a (quickjs 双架构 so), 两种设备通用.
      - name: Build signed release APK
        env:
          NOVA_ABI_FILTERS: arm64-v8a,armeabi-v7a
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Move and rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/ubox-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          files: out/*.apk
