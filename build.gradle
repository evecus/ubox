allprojects {
    repositories {
        // 官方源优先 (GitHub Actions 境外直连最快); 本地国内网络编译时 Gradle 会按顺序重试.
        google()
        mavenCentral()
        // jcenter 镜像: DanmakuFlameMaster(弹幕大师) 0.9.25 只在 jcenter 发布
        // (Maven Central 仅到 0.3.8), 需阿里云 jcenter 兜底, 放最后只兜缺的那个.
        maven { url 'https://maven.aliyun.com/repository/jcenter' }
    }
}

// 仓库根即 Android 工程根: build 输出用 Gradle 默认位置 (根/build, app/build).
// 旧的 rootProject.buildDir 重定向是 Flutter 嵌入时代的 hack, 已移除.

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
