plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

def supportedAbis = ["arm64-v8a", "armeabi-v7a"]
def abiList = (System.getenv('NOVA_ABI_FILTERS') ?: "arm64-v8a")
        .split(',').collect { it.trim() }.findAll { !it.isEmpty() }
def unknownAbis = abiList.findAll { !supportedAbis.contains(it) }
if (abiList.isEmpty() || !unknownAbis.isEmpty()) {
    throw new GradleException("NOVA_ABI_FILTERS 不支持: ${unknownAbis ?: abiList}, 可选: ${supportedAbis}")
}

android {
    namespace = "com.me.ubox"
    // media3 1.11.x 的 aar-metadata 要求 minCompileSdk=36
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.me.ubox"
        minSdk = 24
        targetSdk = 35
        versionCode = 1
        versionName = "1.0.0"
        // 只打包 abiList 里的架构 (见文件顶部 NOVA_ABI_FILTERS 说明)
        ndk {
            abiFilters abiList as String[]
        }
    }

    signingConfigs {
        release {
            // 正式签名: 由环境变量注入 (CI 的 secrets → RELEASE_STORE_FILE 等).
            // 变量缺失或文件不存在时, buildTypes.release 自动回退 debug keystore.
            def envStore = System.getenv("RELEASE_STORE_FILE")
            if (envStore != null && file(envStore).exists()) {
                storeFile file(envStore)
                storePassword System.getenv("RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // 注意: 爬虫 jar 运行时通过 DexClassLoader 引用 okhttp/jsoup/gson 等库,
            // R8 若不 keep 会把它们裁掉 (APK 仅 ~3MB 且 jar 源崩溃). 规则见 proguard-rules.pro.
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            // 签名优先级: 环境变量正式 keystore > debug keystore (CI 未配 secret 也能出可安装包)
            // > 不签名 (unsigned). 正式 keystore 通过 CI secrets 注入, 本地构建用 debug keystore.
            def envStore = System.getenv("RELEASE_STORE_FILE")
            if (envStore != null && file(envStore).exists()) {
                signingConfig = signingConfigs.release
            } else {
                def debugStore = new File(System.getProperty("user.home"), ".android/debug.keystore")
                if (debugStore.exists()) {
                    signingConfig = signingConfigs.debug
                }
            }
        }
        debug {
            // debug 不混淆, 保持构建速度
            minifyEnabled = false
        }
    }

    buildFeatures {
        compose = true
    }
}

dependencies {
    implementation project(":crawler")
    implementation project(":quickjs")

    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"

    def composeBom = platform("androidx.compose:compose-bom:2024.09.00")
    implementation composeBom
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"

    // ExoPlayer (media3) 播放内核, 替代原 Flutter 版的 media_kit/mpv.
    // 视频表面用原生 SurfaceView + setVideoSurfaceView (自绘控制层/弹幕层), 不引 media3-ui.
    implementation "androidx.media3:media3-exoplayer:1.11.1"
    implementation "androidx.media3:media3-common:1.11.1"
    // HLS 独立模块: exoplayer 核心只含 progressive (mp4/flv 等),
    // .m3u8 直链与本地代理 (do=m3u8/do=live) 的 HLS 流必须显式引入,
    // 否则 DefaultMediaSourceFactory 创建不出 HlsMediaSource.
    implementation "androidx.media3:media3-exoplayer-hls:1.11.1"
    // 播放走 OkHttp (信任所有证书 + 共享 DNS + IDN 域名), 对齐原版 mpv 不校验 TLS 的行为.
    implementation "androidx.media3:media3-datasource-okhttp:1.11.1"

    // NextLib: media3 的 FFmpeg/dav1d 软解扩展 (Next Player 的库, Maven Central 预编译).
    // 版本号格式 = media3版本-nextlib版本, 必须与上面的 media3 版本一致.
    // 提供: FFmpeg 视频 (H.264/H.265/VP8/VP9) + dav1d AV1 软解渲染器,
    //       FFmpeg 音频 (AC3/EAC3/DTS/TrueHD/FLAC/ALAC 等) 渲染器.
    // 注意: GPL-3.0 许可; ffmpeg native so 四个 ABI 全带, abiFilters 只留 arm 后实际增量约 10~15MB.
    implementation "io.github.anilbeesetti:nextlib-media3ext:1.11.1-0.17.0"

    implementation "androidx.collection:collection:1.4.0"

    // 弹幕大师 (Bilibili DanmakuFlameMaster), 与原版 UBox 同一依赖;
    // 0.9.25 只在 jcenter 发布 (见根 build.gradle 的阿里云 jcenter 镜像).
    implementation "com.github.ctiao:DanmakuFlameMaster:0.9.25"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
}
